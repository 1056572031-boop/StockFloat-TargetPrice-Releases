name: 故障反馈
description: 报告安装、显示、提醒或更新方面的普通使用问题
title: "[故障] "
body:
  - type: markdown
    attributes:
      value: |
        Issue 内容公开可见。漏洞、信息泄露或更新包校验异常请使用 [私密漏洞报告](https://github.com/1056572031-boop/StockFloat-TargetPrice-Releases/security/advisories/new)，不要在这里披露细节。
        不要上传密码、凭据、签名私钥、个人配置或完整诊断包。截图与日志请先检查并脱敏。
  - type: input
    id: app-version
    attributes:
      label: Skyrocket 版本
      placeholder: 填写右键菜单中的完整版本及 Beta 标记
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS 版本
      placeholder: 填写系统设置中显示的版本号
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac 芯片
      options:
        - Apple Silicon（M 系列）
        - Intel（目前不提供安装包支持）
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: 安装或运行方式
      options:
        - 官方 DMG 首次安装
        - 官方 DMG 覆盖升级
        - 程序内自动更新（OTA）
        - 官方 ZIP 手动安装
        - 从源码运行
        - 其他（请在下方说明）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开程序开始描述操作；说明是否每次发生、是否处于全屏或外接屏环境。
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 如有错误提示，请写出原文；不要包含个人信息。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏后的补充证据（可选）
      description: 仅粘贴与问题有关的少量日志或截图；请遮盖账号、用户路径、股票配置及其他不愿公开的信息，不要附完整诊断包。
  - type: checkboxes
    id: privacy
    attributes:
      label: 发布前确认
      options:
        - label: 我已检查内容不含凭据、私钥、个人配置或完整诊断包；本反馈不包含应私下报告的安全问题。
          required: true
