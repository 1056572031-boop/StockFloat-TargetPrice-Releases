# Skyrocket（原名 实时股价-目标价版）质量门禁：离屏全量回归 + Cocoa 原生平台冒烟。
name: ci

# 触发名单**只留 public-source**，这一份文件会被公开快照原样带走、两个仓库共用：
# 公开仓的 public-source 命中它（标准运行器对公开仓免费、不限时长），
# 私有仓没有这个分支，于是开发分支的每次推送都不再生成运行。
# 为什么不在私有仓跑：macOS 运行器在私有仓按 10 倍费率折算，每月免费额度
# 折成真实 macOS 时间只有 200 分钟，本项目的推送频率几天就用完；额度用完且
# 未设消费额时，GitHub 不启动作业，只留一条 6 秒的 failure（2026-10-17 实测三连红）。
# 私有仓侧的强制回归本来就不依赖云端：run_tests.sh 全绿落关卡时间戳，
# build_release.sh 第 0 步按构建输入指纹核验，不同源自动补跑一整轮。
on:
  push:
    branches: [public-source]
  pull_request:
    branches: [public-source]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-offscreen:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.10"
          cache: pip
      - name: 安装依赖到工程内 .venv
        # run_tests.sh 第一件事就是找 .venv/bin/python3，找不到按约定 exit 1
        # （AGENTS §1：不许脱离工程 venv 跑测试）。CI 若只 pip install 到 runner 的系统
        # 解释器，公开仓库的 CI 会在关卡门口就红 —— 这层 venv 是必须的，不是装饰。
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --require-hashes -r requirements.lock
      - name: 依赖锁定一致性与已知漏洞检查
        run: .venv/bin/python tools/dependency_audit.py
      - name: 运行全量回归与覆盖率门禁（offscreen）
        env:
          QT_QPA_PLATFORM: offscreen
          SF_PUBLIC_REGRESSION: ${{ (github.ref_name == 'public-source' || github.base_ref == 'public-source') && '1' || '0' }}
        # pipefail 是必须的：加了 tee 之后管道退出码默认取最后一段，
        # 那会让 run_tests.sh 失败也"绿着过"，整道门禁变成假门。
        run: |
          set -o pipefail
          ./run_tests.sh 2>&1 | tee run_tests_offscreen.log
      - name: 失败时把日志尾部写成注解
        # Actions 的日志下载端点常需额外权限（本项目实测 401），而 jobs/runs 与
        # annotations 用同一个令牌就能读。把尾部塞进注解，红的时候才有东西可查 ——
        # 之前 CI 连着红，谁都说不清是哪一条。
        if: failure()
        run: |
          tail -n 60 run_tests_offscreen.log > /tmp/ci_tail.txt || true
          echo "::error::run_tests 尾部：$(tr '\n' ' ' < /tmp/ci_tail.txt | cut -c1-900)"
      - name: 导出覆盖率报告
        # 同上：coverage 装在 .venv 里，系统解释器上没有这个模块。
        run: |
          .venv/bin/python -m coverage xml -o coverage.xml
          .venv/bin/python -m coverage json -o coverage.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-evidence
          include-hidden-files: true
          path: |
            coverage.xml
            coverage.json
            build/.coverage-provenance.json
            build/change-coverage.json
            run_tests_offscreen.log

  test-cocoa-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.10"
          cache: pip
      - name: 安装依赖到工程内 .venv
        # run_tests.sh 第一件事就是找 .venv/bin/python3，找不到按约定 exit 1
        # （AGENTS §1：不许脱离工程 venv 跑测试）。CI 若只 pip install 到 runner 的系统
        # 解释器，公开仓库的 CI 会在关卡门口就红 —— 这层 venv 是必须的，不是装饰。
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --require-hashes -r requirements.lock
      - name: Cocoa 原生平台冒烟
        env:
          QT_QPA_PLATFORM: cocoa
        # 必须用工程内 .venv 的解释器：上面那步把 requirements.txt 全装进 .venv，
        # 而 setup-python 给的系统 python 是干净的 —— 2026-10-10 的 CI 就是这样红的：
        # 三个模块全部 ModuleNotFoundError: No module named 'PyQt6'，
        # 报出来像"产物坏了"，实际是 job 用错了 Python。本机复现不了，
        # 因为这台机器的系统 python 里恰好也有 PyQt6（AGENTS §1 那句
        # "系统 python3 可能不是项目运行时"在 CI 上是反过来的：它一定不是）。
        run: .venv/bin/python -m unittest tests.test_smoke tests.test_render tests.test_quit_lifecycle -v
